name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Generated wire code is up to date
        run: dotnet run --project src/Meridian.Wire.Gen -- --check
      - name: Content pack is up to date and valid
        run: dotnet run --project src/Meridian.ContentCompiler -- --check
      - name: Build (warnings are errors)
        run: dotnet build Meridian.slnx -c Release
      - name: Test
        run: dotnet test --solution Meridian.slnx -c Release --no-build

  db:
    # Migrations apply cleanly to an empty Postgres, re-apply as a no-op, and pass db/checks.sql.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/db-check.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  m0-gate:
    # Load test: 100 bots, one zone, 20 Hz. Thresholds live in the script.
    # wander = movement/chat only; hunt = bots fight the zone's mobs.
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        mode: [wander, hunt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: scripts/m0-gate.sh 100 60 ${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-gate-logs-${{ matrix.mode }}
          path: artifacts/m0-gate/

  m1-gate:
    # Two headless Godot clients on autopilot kill the same mob together.
    runs-on: ubuntu-latest
    needs: build-test
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Godot (.NET build)
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$(ls $RUNNER_TEMP/godot/*/Godot_v*_mono_linux.x86_64)" >> "$GITHUB_ENV"
      - run: scripts/m1-gate.sh 150
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-gate-logs
          path: artifacts/m1-gate/
