name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Generated wire code is up to date
        run: dotnet run --project src/Meridian.Wire.Gen -- --check
      - name: Build (warnings are errors)
        run: dotnet build Meridian.slnx -c Release
      - name: Test
        run: dotnet test --solution Meridian.slnx -c Release --no-build

  m0-gate:
    # Load test: 100 bots, one zone, 20 Hz. Thresholds live in the script.
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: scripts/m0-gate.sh 100 60
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-gate-logs
          path: artifacts/m0-gate/
