id: 1
key: glasswind_flats
name: Glasswind Flats
bounds_m: { min_x: -2000, min_z: -2000, max_x: 2000, max_z: 2000 }
spawns:
  - mob: mob.glasswind_skitter
    count: 40
    center_m: { x: 0, z: 0 }
    ring_m: { inner: 40, outer: 120 }
# The transit pad east of the spawn leads to Rustfall Basin; the one west, to Freeport Ashgate.
exits:
  - to: rustfall_basin
    area_m: { min_x: 58, min_z: -4, max_x: 66, max_z: 4 }
    arrive_m: { x: -50, z: 0 }
  - to: freeport_ashgate
    area_m: { min_x: -66, min_z: -4, max_x: -58, max_z: 4 }
    arrive_m: { x: 50, z: 0 }
